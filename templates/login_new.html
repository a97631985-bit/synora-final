<!DOCTYPE html>
<html class="dark" lang="en">
<head>{% include "head.html" %}</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden antialiased">
<div class="ambient-bg"></div>
<main class="w-full max-w-md px-4 md:px-0 relative z-10">
  <div class="flex justify-center mb-6"><img src="/static/logo.png" class="h-10 w-auto"></div>
  <div class="glass-panel rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold">Welcome back</h1>
      <p class="text-on-surface-variant text-sm mt-1">Sign in to continue</p>
    </div>
    {% if error %}<div class="bg-error-container/20 border border-error/30 text-on-error-container rounded-xl px-4 py-3 text-sm mb-4">{{ error }}</div>{% endif %}

    <button onclick="googleSignup()" type="button" class="w-full bg-white text-black rounded-xl py-3 font-semibold text-sm flex items-center justify-center gap-2 hover:opacity-90 transition mb-4">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <div class="flex items-center gap-3 my-4"><div class="flex-grow h-px bg-white/10"></div><span class="text-xs text-on-surface-variant">or</span><div class="flex-grow h-px bg-white/10"></div></div>

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Email / Phone</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">mail</span>
          <input name="email" required placeholder="you@email.com or phone" class="w-full input-glass rounded-xl py-3 pl-10 pr-4 text-sm">
        </div>
      </div>
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Password</label>
        <input name="password" type="password" required placeholder="••••••••" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
        <div class="flex justify-between mt-2">
          <label class="text-xs flex items-center gap-1"><input type="checkbox" class="rounded"> Remember me</label>
          <a href="#" class="text-xs text-primary hover:underline" onclick="alert('OTP login: use phone OTP below');return false;">Login via OTP?</a>
        </div>
      </div>
      <button type="submit" class="w-full synora-gradient text-on-primary rounded-xl py-3 text-sm font-bold hover:opacity-90 transition">Sign In</button>
    </form>

    <!-- OTP Login -->
    <div class="mt-6 pt-6 border-t border-white/5">
      <p class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-2">Or login via OTP</p>
      <div class="flex gap-2">
        <input id="otpTarget" placeholder="Email or phone for OTP" class="flex-1 input-glass rounded-xl py-2.5 px-3 text-sm">
        <button onclick="sendLoginOtp()" class="px-4 rounded-xl bg-tertiary/20 border border-tertiary/30 text-tertiary text-xs font-bold">Send OTP</button>
      </div>
      <div id="loginOtpRow" class="hidden mt-2 flex gap-2">
        <input id="loginOtp" placeholder="Enter OTP" maxlength="6" class="flex-1 input-glass rounded-xl py-2 px-3 text-sm">
        <button onclick="verifyLoginOtp()" class="px-4 rounded-xl bg-primary text-on-primary text-xs font-bold">Verify & Login</button>
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <a href="/dashboard" class="flex-1 py-3 rounded-xl bg-white/5 border border-white/10 text-center text-sm font-semibold">Skip for now</a>
      <a href="/signup" class="flex-1 py-3 rounded-xl bg-primary/20 border border-primary/30 text-center text-sm font-bold text-primary">Create account</a>
    </div>
  </div>
</main>
<script>
async function sendLoginOtp(){
  const target=document.getElementById('otpTarget').value.trim();
  if(!target) return alert('Enter email/phone');
  const kind = target.includes('@') ? 'email' : 'phone';
  const r=await fetch('/auth/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,target})});
  const d=await r.json();
  if(d.ok){ alert('OTP: '+d.otp); document.getElementById('loginOtpRow').classList.remove('hidden'); } else alert(d.error);
}
async function verifyLoginOtp(){
  const target=document.getElementById('otpTarget').value.trim();
  const otp=document.getElementById('loginOtp').value.trim();
  const kind = target.includes('@') ? 'email' : 'phone';
  const r=await fetch('/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({kind,target,otp,login:true})});
  const d=await r.json();
  if(d.ok) window.location.href='/dashboard'; else alert(d.error);
}
async function googleSignup(){
  const email=prompt('Demo Google — enter Gmail:');
  if(!email) return;
  const r=await fetch('/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({email})});
  const d=await r.json();
  if(d.ok) window.location.href='/dashboard'; else alert(d.error);
}
</script>
</body></html>
