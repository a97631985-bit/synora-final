<!DOCTYPE html>
<html class="dark" lang="en">
<head>{% include "head.html" %}</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden antialiased">
<div class="ambient-bg"></div>
<style>
  @keyframes pop2 { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
</style>
<main class="w-full max-w-md px-4 relative z-10 text-center">
  <div class="flex justify-center mb-6"><img src="/static/logo.png" alt="Synora" class="h-10 w-auto"></div>
  <div class="glass-panel rounded-2xl p-8 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    <div class="w-16 h-16 rounded-full synora-gradient flex items-center justify-center mx-auto mb-4" style="animation:pop2 0.5s ease-out">
      <span class="material-symbols-outlined text-on-primary" style="font-size:32px; font-variation-settings:'FILL' 1;">check</span>
    </div>
    <h1 class="text-xl font-bold mb-2">Password Updated</h1>
    <p class="text-on-surface-variant text-sm leading-relaxed">Your password has been changed successfully. You can now sign in with your new password.</p>
    <a href="/login" class="btn-primary mt-6" style="display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none">
      <span class="material-symbols-outlined" style="font-size:18px">login</span> Sign In
    </a>
  </div>
</main>
</body></html>
