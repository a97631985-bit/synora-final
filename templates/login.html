<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  {% include "head.html" %}
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col relative overflow-hidden">
<div class="ambient-bg"></div>

<main class="flex-grow flex items-center justify-center p-5 md:p-10 relative z-10">
  <div class="w-full max-w-md">
    <div class="glass-panel rounded-xl p-8 md:p-10 shadow-2xl relative overflow-hidden flex flex-col gap-6">
      <!-- Subtle top highlight -->
      <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
      <!-- Ambient glow inside card -->
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/10 rounded-full blur-3xl"></div>

      <!-- Logo Section -->
      <div class="flex justify-center relative z-10">
        <img src="/static/logo.png" alt="Synora AI Logo" class="h-12 w-auto object-contain">
      </div>

      <div class="text-center relative z-10">
        <h1 class="text-xl font-bold tracking-tight text-on-surface">Welcome Back</h1>
        <p class="text-on-surface-variant mt-2">Sign in to continue your journey.</p>
      </div>

      {% if error %}
      <div class="bg-error-container/20 border border-error/30 text-on-error-container rounded-xl px-4 py-3 text-sm flex items-center gap-2 relative z-10">
        <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">error</span>
        {{ error }}
      </div>
      {% endif %}

      <!-- Form -->
      <form action="/login" method="POST" class="flex flex-col gap-4 relative z-10">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-semibold text-on-surface-variant ml-1" for="email">Email Address</label>
          <div class="input-glass rounded-lg flex items-center px-4 py-3">
            <span class="material-symbols-outlined text-outline mr-3 text-[20px]">mail</span>
            <input class="bg-transparent border-none p-0 flex-grow text-base text-on-surface focus:ring-0 placeholder-outline-variant" id="email" name="email" placeholder="you@university.edu" required type="email">
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-center ml-1">
            <label class="text-sm font-semibold text-on-surface-variant" for="password">Password</label>
            <a href="/signup" class="text-sm font-semibold text-primary hover:text-primary-fixed transition-colors">Forgot Password?</a>
          </div>
          <div class="input-glass rounded-lg flex items-center px-4 py-3">
            <span class="material-symbols-outlined text-outline mr-3 text-[20px]">lock</span>
            <input class="bg-transparent border-none p-0 flex-grow text-base text-on-surface focus:ring-0 placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required type="password">
            <button aria-label="Toggle password visibility" class="text-outline hover:text-on-surface transition-colors ml-2" type="button" onclick="var i=document.getElementById('password');i.type=i.type==='password'?'text':'password';">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>
        <button class="btn-gradient rounded-lg py-3.5 mt-4 text-sm font-semibold w-full flex items-center justify-center gap-2 relative overflow-hidden group" type="submit">
          <span class="relative z-10">Sign In</span>
          <span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform text-[18px]">arrow_forward</span>
          <div class="absolute top-0 -inset-full h-full w-1/2 transform -skew-x-12 bg-gradient-to-r from-transparent to-white opacity-20 group-hover:translate-x-[300%] transition-transform duration-700"></div>
        </button>
      </form>

      <div class="flex items-center relative z-10">
        <div class="flex-grow border-t border-outline-variant/30"></div>
        <span class="px-4 text-sm font-semibold text-on-surface-variant">or continue with</span>
        <div class="flex-grow border-t border-outline-variant/30"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4 relative z-10">
        <button class="social-btn rounded-lg py-3 flex items-center justify-center gap-2 text-sm font-semibold text-on-surface" type="button" onclick="document.getElementById('email').value='demo@synora.ai';document.getElementById('password').value='demo1234';alert('Demo credentials filled — hit Sign In!');">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Demo Login
        </button>
        <button class="social-btn rounded-lg py-3 flex items-center justify-center gap-2 text-sm font-semibold text-on-surface" type="button">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.31-.88 3.5-0.87 1.83.05 3.23.85 4.09 2.08-3.32 2.06-2.73 6.27.53 7.62-.73 1.44-1.63 2.72-3.2 3.34zm-3.04-13.6c-.1-1.89 1.4-3.53 3.2-3.68.23 1.94-1.58 3.61-3.2 3.68z"/></svg>
          Apple
        </button>
      </div>

      <div class="text-center relative z-10">
        <p class="text-on-surface-variant">
          Don't have an account?
          <a class="font-semibold text-primary hover:text-tertiary transition-colors ml-1" href="/signup">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</main>

<footer class="text-on-surface-variant text-sm w-full flex flex-col items-center gap-3 py-8 relative z-10">
  <div class="flex gap-6">
    <a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
    <a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
    <a class="hover:text-primary transition-colors" href="#">Help Center</a>
  </div>
  <p>© 2026 Synora AI. Adaptive Calm Productivity.</p>
</footer>
</body>
</html>
