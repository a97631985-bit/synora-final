<!DOCTYPE html>
<html class="dark" lang="en">
<head>{% include "head.html" %}</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center relative overflow-hidden antialiased">
<div class="ambient-bg"></div>
<main class="w-full max-w-lg px-4 md:px-0 relative z-10 py-8">
  <div class="flex justify-center mb-6"><img src="/static/logo.png" alt="Synora" class="h-10 w-auto"></div>
  <div class="glass-panel rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-[-0.03em]">Create your Synora account</h1>
      <p class="text-on-surface-variant text-sm mt-1">Personalized timetable • AI healing • progress tracking</p>
    </div>
    {% if error %}<div class="bg-error-container/20 border border-error/30 text-on-error-container rounded-xl px-4 py-3 text-sm mb-4">{{ error }}</div>{% endif %}

    <!-- OAuth -->
    <button onclick="googleSignup()" type="button" class="w-full bg-white text-black rounded-xl py-3 font-semibold text-sm flex items-center justify-center gap-2 hover:opacity-90 transition">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <div class="flex items-center gap-3 my-5"><div class="flex-grow h-px bg-white/10"></div><span class="text-xs text-on-surface-variant">or</span><div class="flex-grow h-px bg-white/10"></div></div>

    <form id="signupForm" action="/signup" method="POST" class="space-y-4">
      <!-- Step 1: Basic -->
      <div id="step1" class="space-y-4">
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Full Name *</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">person</span>
            <input name="username" required placeholder="Aarav Sharma" class="w-full input-glass rounded-xl py-3 pl-10 pr-4 text-sm">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Email *</label>
          <div class="flex gap-2">
            <div class="relative flex-1">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">mail</span>
              <input name="email" id="emailInput" type="email" required placeholder="aarav@email.com" class="w-full input-glass rounded-xl py-3 pl-10 pr-4 text-sm">
            </div>
            <button type="button" onclick="sendOtp('email')" id="emailOtpBtn" class="px-4 rounded-xl bg-tertiary/20 border border-tertiary/30 text-tertiary text-xs font-bold hover:bg-tertiary/30 transition">Send OTP</button>
          </div>
          <div id="emailOtpRow" class="hidden mt-2 flex gap-2">
            <input id="emailOtp" placeholder="Enter OTP" maxlength="6" class="flex-1 input-glass rounded-xl py-2 px-3 text-sm">
            <button type="button" onclick="verifyOtp('email')" class="px-4 rounded-xl bg-primary text-on-primary text-xs font-bold">Verify</button>
            <span id="emailVerifyBadge" class="hidden text-primary text-xs flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">verified</span> Verified</span>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Phone (optional) — OTP verification</label>
          <div class="flex gap-2">
            <div class="relative flex-1">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">call</span>
              <input name="phone" id="phoneInput" placeholder="+91 98765 43210" class="w-full input-glass rounded-xl py-3 pl-10 pr-4 text-sm">
            </div>
            <button type="button" onclick="sendOtp('phone')" id="phoneOtpBtn" class="px-4 rounded-xl bg-tertiary/20 border border-tertiary/30 text-tertiary text-xs font-bold hover:bg-tertiary/30 transition">Send OTP</button>
          </div>
          <div id="phoneOtpRow" class="hidden mt-2 flex gap-2">
            <input id="phoneOtp" placeholder="OTP" maxlength="6" class="flex-1 input-glass rounded-xl py-2 px-3 text-sm">
            <button type="button" onclick="verifyOtp('phone')" class="px-4 rounded-xl bg-primary text-on-primary text-xs font-bold">Verify</button>
            <span id="phoneVerifyBadge" class="hidden text-primary text-xs flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">verified</span> Verified</span>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Password *</label>
            <input name="password" type="password" required placeholder="Min 6 chars" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Confirm *</label>
            <input name="confirm" type="password" required placeholder="••••" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
          </div>
        </div>
        <button type="button" onclick="goStep(2)" class="w-full synora-gradient text-on-primary rounded-xl py-3 text-sm font-bold hover:opacity-90 transition flex items-center justify-center gap-2">Next: Your Study Profile <span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>
      </div>

      <!-- Step 2: Onboarding -->
      <div id="step2" class="hidden space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="font-bold">Your Study Profile</h3>
          <button type="button" onclick="goStep(1)" class="text-xs text-on-surface-variant hover:text-primary">← Back</button>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Age</label>
            <input name="age" type="number" min="10" max="80" placeholder="18" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">School / College</label>
            <input name="school" placeholder="IIT Coaching / DU" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Target Exam *</label>
          <select name="exam_goal" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
            <option value="">Select</option>
            <option>JEE</option><option>NEET</option><option>GATE</option><option>UPSC</option><option>SSC CGL</option><option>Banking</option><option>CBSE 12</option><option>CUET</option><option>Other</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Level</label>
            <select name="study_level" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
              <option value="">Select</option><option>Class 11</option><option>Class 12</option><option>Dropper</option><option>College</option><option>Working</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Daily Hours</label>
            <select name="daily_hours" class="w-full input-glass rounded-xl py-3 px-4 text-sm">
              <option value="3">3 hrs</option><option value="4">4 hrs</option><option value="6">6 hrs</option><option value="8">8 hrs</option><option value="10">10 hrs</option>
            </select>
          </div>
        </div>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" required class="rounded"> I agree to <a href="#" class="text-primary underline">Terms</a> & <a href="#" class="text-primary underline">Privacy</a></label>
        <div class="flex gap-3">
          <a href="/dashboard" class="flex-1 py-3 rounded-xl bg-white/5 border border-white/10 text-center text-sm font-semibold hover:bg-white/10 transition">Skip for now</a>
          <button type="submit" class="flex-1 synora-gradient text-on-primary rounded-xl py-3 text-sm font-bold hover:opacity-90 transition">Create Account</button>
        </div>
      </div>
    </form>
    <p class="text-center text-sm text-on-surface-variant mt-6">Already have an account? <a href="/login" class="text-primary font-bold hover:underline">Log in</a></p>
  </div>
</main>
<script>
function goStep(n){ document.getElementById('step1').classList.toggle('hidden', n!==1); document.getElementById('step2').classList.toggle('hidden', n!==2); window.scrollTo({top:0, behavior:'smooth'}); }
async function sendOtp(kind){
  const val = (kind==='email' ? document.getElementById('emailInput').value : document.getElementById('phoneInput').value).trim();
  if(!val) { alert('Enter '+kind+' first'); return; }
  const r = await fetch('/auth/send-otp', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({kind, target: val})});
  const d = await r.json();
  if(d.ok){ alert('OTP sent to '+val+' (demo: '+d.otp+')'); document.getElementById(kind+'OtpRow').classList.remove('hidden'); } else alert(d.error||'Failed');
}
async function verifyOtp(kind){
  const otp = document.getElementById(kind+'Otp').value.trim();
  const target = (kind==='email' ? document.getElementById('emailInput').value : document.getElementById('phoneInput').value).trim();
  const r = await fetch('/auth/verify-otp', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({kind, target, otp})});
  const d = await r.json();
  if(d.ok){ document.getElementById(kind+'VerifyBadge').classList.remove('hidden'); document.getElementById(kind+'OtpRow').classList.add('hidden'); } else alert(d.error||'Wrong OTP');
}
async function googleSignup(){
  // Mock Google flow — in production use Firebase/Google Identity
  const email = prompt('Demo Google — enter your Gmail:');
  if(!email) return;
  const r = await fetch('/auth/google', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})});
  const d = await r.json();
  if(d.ok) window.location.href='/dashboard'; else alert(d.error);
}
</script>
</body></html>
