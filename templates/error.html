<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  {% include "head.html" %}
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-4">
<div class="ambient-bg"></div>

<main class="relative z-10 w-full max-w-md">
  <div class="flex justify-center mb-6">
    <a href="/" class="active:scale-95 transition-transform">
      <img src="/static/logo.png" alt="Synora AI Logo" class="h-10 w-auto object-contain">
    </a>
  </div>

  <div class="glass-panel rounded-2xl p-8 text-center shadow-2xl">
    <div class="w-16 h-16 rounded-2xl synora-gradient flex items-center justify-center mx-auto mb-5">
      <span class="material-symbols-outlined text-on-primary" style="font-size:32px; font-variation-settings:'FILL' 1;">error</span>
    </div>

    <p class="text-xs font-bold tracking-[0.2em] text-on-surface-variant uppercase mb-1">Error {{ code }}</p>
    <h1 class="text-2xl font-bold tracking-[-0.02em] mb-2">{{ title }}</h1>
    <p class="text-sm text-on-surface-variant leading-relaxed mb-6">{{ message }}</p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/dashboard" class="synora-gradient text-on-primary text-sm font-bold rounded-xl px-5 py-3 hover:opacity-90 hover:scale-[1.01] active:scale-95 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">dashboard</span>
        Go to Dashboard
      </a>
      <a href="/login" class="text-sm font-semibold rounded-xl px-5 py-3 border border-white/10 text-on-surface-variant hover:text-on-surface hover:bg-white/5 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">login</span>
        Log in
      </a>
    </div>
  </div>
</main>
</body>
</html>
