<!DOCTYPE html>
<html class="dark" lang="en">
<head>{% include "head.html" %}</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden antialiased">
<div class="ambient-bg"></div>
<style>
  @keyframes slideUp2 { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pop2 { 0%{transform:scale(0)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .card { width:100%; max-width:400px; animation:slideUp2 0.5s ease-out; }
  .input-wrap2 {
    display:flex; align-items:center; background:rgba(12,15,16,0.8);
    border:1.5px solid rgba(138,147,140,0.2); border-radius:14px; transition:all 0.3s;
  }
  .input-wrap2:focus-within { border-color:#9ad3b6; box-shadow:0 0 0 3px rgba(154,211,182,0.1); }
  .input-wrap2 .icon { padding:0 14px; color:#404943; display:flex; align-items:center; }
  .input-wrap2 input { flex:1; background:transparent; border:none; outline:none; padding:14px 4px 14px 0; color:#e1e3e4; font-size:0.9rem; font-family:inherit; }
  .toggle-eye { padding:0 14px; border:none; background:none; color:#404943; cursor:pointer; }
</style>
<main class="w-full max-w-md px-4 relative z-10">
  <div class="flex justify-center mb-6"><img src="/static/logo.png" alt="Synora" class="h-10 w-auto"></div>
  <div class="card glass-panel rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    {% if success %}
      <div class="text-center">
        <div class="w-16 h-16 rounded-full synora-gradient flex items-center justify-center mx-auto" style="animation:pop2 0.5s ease-out">
          <span class="material-symbols-outlined text-on-primary" style="font-size:32px; font-variation-settings:'FILL' 1;">check</span>
        </div>
        <h1 class="text-xl font-bold mt-4 mb-2">Password Changed</h1>
        <p class="text-on-surface-variant text-sm">Your password has been updated successfully.</p>
        <a href="/profile" class="btn-primary mt-6" style="display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none">
          <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span> Back to Profile
        </a>
      </div>
    {% else %}
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-2xl synora-gradient flex items-center justify-center mx-auto mb-4">
          <span class="material-symbols-outlined text-on-primary" style="font-size:32px; font-variation-settings:'FILL' 1;">lock</span>
        </div>
        <h1 class="text-xl font-bold">Change Password</h1>
      </div>
      {% if error %}<div class="bg-error-container/20 border border-error/30 text-on-error-container rounded-xl px-4 py-3 text-sm mb-4">{{ error }}</div>{% endif %}
      <form action="/password" method="POST">
        <div style="margin-bottom:1rem">
          <label style="display:block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#8a938c; margin-bottom:6px">Current Password</label>
          <div class="input-wrap2">
            <span class="icon"><span class="material-symbols-outlined">lock</span></span>
            <input id="cp" name="current_password" type="password" placeholder="Your current password">
            <button type="button" class="toggle-eye" onclick="var i=document.getElementById('cp');i.type=i.type==='password'?'text':'password';"><span class="material-symbols-outlined" style="font-size:20px">visibility</span></button>
          </div>
        </div>
        <div style="margin-bottom:1rem">
          <label style="display:block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#8a938c; margin-bottom:6px">New Password</label>
          <div class="input-wrap2">
            <span class="icon"><span class="material-symbols-outlined">key</span></span>
            <input id="np" name="new_password" type="password" placeholder="Min 6 chars">
            <button type="button" class="toggle-eye" onclick="var i=document.getElementById('np');i.type=i.type==='password'?'text':'password';"><span class="material-symbols-outlined" style="font-size:20px">visibility</span></button>
          </div>
        </div>
        <div style="margin-bottom:1.5rem">
          <label style="display:block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#8a938c; margin-bottom:6px">Confirm New Password</label>
          <div class="input-wrap2">
            <span class="icon"><span class="material-symbols-outlined">lock_reset</span></span>
            <input id="np2" name="confirm" type="password" placeholder="Repeat new password">
            <button type="button" class="toggle-eye" onclick="var i=document.getElementById('np2');i.type=i.type==='password'?'text':'password';"><span class="material-symbols-outlined" style="font-size:20px">visibility</span></button>
          </div>
        </div>
        <button type="submit" class="btn-primary" style="display:flex; align-items:center; justify-content:center; gap:8px">
          <span class="material-symbols-outlined" style="font-size:18px">check</span> Update Password
        </button>
      </form>
    {% endif %}
  </div>
</main>
</body></html>
