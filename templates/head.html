<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Synora AI{% endblock %}</title>
<script>
  /* Apply the saved theme before first paint to avoid a flash of the wrong mode. */
  (function () {
    try {
      var t = localStorage.getItem("synora-theme");
      if (t !== "light") t = "dark";
      document.documentElement.classList.toggle("dark", t === "dark");
      document.documentElement.style.colorScheme = t;
    } catch (e) { /* localStorage unavailable */ }
  })();
</script>

          "on-secondary-fixed": "rgb(var(--c-on-secondary-fixed) / <alpha-value>)",
          "on-secondary-fixed-variant": "rgb(var(--c-on-secondary-fixed-variant) / <alpha-value>)",

          "tertiary-fixed": "rgb(var(--c-tertiary-fixed) / <alpha-value>)",
          "tertiary-fixed-dim": "rgb(var(--c-tertiary-fixed-dim) / <alpha-value>)",
          "on-tertiary-fixed": "rgb(var(--c-on-tertiary-fixed) / <alpha-value>)",
          "on-tertiary-fixed-variant": "rgb(var(--c-on-tertiary-fixed-variant) / <alpha-value>)",
          "error": "rgb(var(--c-error) / <alpha-value>)",
          "on-error": "rgb(var(--c-on-error) / <alpha-value>)",

        fontFamily: {
          sans: ["Plus Jakarta Sans", "ui-sans-serif", "system-ui", "sans-serif"]

<style>
  /* ============================================================
     Synora palette — one set of tokens, two themes.
     Dark values match the original design; light values are the
     accessible daylight equivalents of the same brand system.
     ============================================================ */
  :root,
  html.dark {
    --c-background: 17 20 21;
    --c-surface: 17 20 21;
    --c-surface-dim: 17 20 21;
    --c-surface-bright: 55 58 59;
    --c-surface-container-lowest: 12 15 16;
    --c-surface-container-low: 25 28 29;
    --c-surface-container: 29 32 33;
    --c-surface-container-high: 40 42 43;
    --c-surface-container-highest: 50 53 54;
    --c-surface-variant: 50 53 54;
    --c-on-surface: 225 227 228;
    --c-on-surface-variant: 192 201 194;
    --c-on-background: 225 227 228;
    --c-inverse-surface: 225 227 228;
    --c-inverse-on-surface: 46 49 50;
    --c-outline: 138 147 140;
    --c-outline-variant: 64 73 67;
    --c-surface-tint: 154 211 182;
    --c-primary: 154 211 182;
    --c-on-primary: 0 56 37;
    --c-primary-container: 41 95 72;
    --c-on-primary-container: 158 215 186;
    --c-inverse-primary: 51 104 81;
    --c-primary-fixed: 182 239 209;
    --c-primary-fixed-dim: 154 211 182;
    --c-on-primary-fixed: 0 33 20;
    --c-on-primary-fixed-variant: 24 80 58;
    --c-secondary: 221 183 255;
    --c-on-secondary: 73 0 128;
    --c-secondary-container: 111 0 190;
    --c-on-secondary-container: 214 169 255;
    --c-secondary-fixed: 240 219 255;
    --c-secondary-fixed-dim: 221 183 255;
    --c-on-secondary-fixed: 44 0 81;
    --c-on-secondary-fixed-variant: 105 0 179;
    --c-tertiary: 76 215 246;
    --c-on-tertiary: 0 54 64;
    --c-tertiary-container: 0 94 110;
    --c-on-tertiary-container: 81 219 250;
    --c-tertiary-fixed: 172 237 255;
    --c-tertiary-fixed-dim: 76 215 246;
    --c-on-tertiary-fixed: 0 31 38;
    --c-on-tertiary-fixed-variant: 0 78 92;
    --c-error: 255 180 171;
    --c-on-error: 105 0 5;
    --c-error-container: 147 0 10;
    --c-on-error-container: 255 218 214;
  }

  html:not(.dark) {
    --c-background: 246 249 246;
    --c-surface: 246 249 246;
    --c-surface-dim: 218 222 218;
    --c-surface-bright: 255 255 255;
    --c-surface-container-lowest: 255 255 255;
    --c-surface-container-low: 240 244 239;
    --c-surface-container: 234 239 233;
    --c-surface-container-high: 227 233 226;
    --c-surface-container-highest: 219 226 218;
    --c-surface-variant: 219 226 218;
    --c-on-surface: 24 29 26;
    --c-on-surface-variant: 63 73 67;
    --c-on-background: 24 29 26;
    --c-inverse-surface: 45 49 46;
    --c-inverse-on-surface: 238 242 237;
    --c-outline: 111 121 114;
    --c-outline-variant: 191 201 193;
    --c-surface-tint: 30 107 75;
    --c-primary: 15 107 74;
    --c-on-primary: 255 255 255;
    --c-primary-container: 167 243 202;
    --c-on-primary-container: 0 33 19;
    --c-inverse-primary: 140 214 175;
    --c-primary-fixed: 167 243 202;
    --c-primary-fixed-dim: 140 214 175;
    --c-on-primary-fixed: 0 33 19;
    --c-on-primary-fixed-variant: 0 82 53;
    --c-secondary: 122 31 191;
    --c-on-secondary: 255 255 255;
    --c-secondary-container: 240 219 255;
    --c-on-secondary-container: 44 0 81;
    --c-secondary-fixed: 240 219 255;
    --c-secondary-fixed-dim: 221 183 255;
    --c-on-secondary-fixed: 44 0 81;
    --c-on-secondary-fixed-variant: 105 0 179;
    --c-tertiary: 0 103 125;
    --c-on-tertiary: 255 255 255;
    --c-tertiary-container: 172 237 255;
    --c-on-tertiary-container: 0 31 38;
    --c-tertiary-fixed: 172 237 255;
    --c-tertiary-fixed-dim: 76 215 246;
    --c-on-tertiary-fixed: 0 31 38;
    --c-on-tertiary-fixed-variant: 0 78 92;
    --c-error: 186 26 26;
    --c-on-error: 255 255 255;
    --c-error-container: 255 218 214;
    --c-on-error-container: 147 0 10;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    background-color: rgb(var(--c-background));
    color: rgb(var(--c-on-surface));
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  html:not(.dark) body { background-color: rgb(var(--c-background)); }

  .glass-panel {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .glass-strong {
    background: rgba(17, 20, 21, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .synora-gradient {
    background: linear-gradient(135deg, #9ad3b6 0%, #4cd7f6 100%);
  }
  .text-gradient {
    background: linear-gradient(135deg, #9ad3b6 0%, #4cd7f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .glow-effect { box-shadow: 0 0 40px rgba(41, 95, 72, 0.35); }
  .healing-glow { box-shadow: 0 0 18px rgba(76, 215, 246, 0.25); }

  .ambient-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 15% 10%, rgba(41, 95, 72, 0.18) 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(76, 215, 246, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 60% 40%, rgba(111, 0, 190, 0.06) 0%, transparent 50%);
  }

  html {
    color-scheme: dark;
  }
  html:not(.dark) {
    color-scheme: light;
  }

  .input-glass {
    background: rgba(25, 28, 29, 0.8);
    border: 1px solid rgba(138, 147, 140, 0.3);
    transition: all 0.3s ease;
    color-scheme: dark;
  }
  .input-glass:focus-within {
    border-color: #9ad3b6;
    box-shadow: 0 0 0 1px #9ad3b6, 0 0 18px rgba(154, 211, 182, 0.15);
  }
  html:not(.dark) .input-glass {
    background: rgba(255, 255, 255, 0.9);
    border-color: rgba(15, 40, 28, 0.18);
    color-scheme: light;
  }
  html:not(.dark) .input-glass:focus-within {
    border-color: rgb(var(--c-primary));
    box-shadow: 0 0 0 1px rgb(var(--c-primary)), 0 0 18px rgba(15, 107, 74, 0.12);
  }
  input[type="date"], input[type="time"],
  select.input-glass {
    color-scheme: dark;
    color: #e1e3e4 !important;
    background-color: rgba(25, 28, 29, 0.9) !important;
  }
  html:not(.dark) input[type="date"],
  html:not(.dark) input[type="time"],
  html:not(.dark) select.input-glass {
    color-scheme: light;
    color: #181d1a !important;
    background-color: rgba(255, 255, 255, 0.9) !important;
  }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.8);
    cursor: pointer;
  }
  html:not(.dark) input[type="date"]::-webkit-calendar-picker-indicator,
  html:not(.dark) input[type="time"]::-webkit-calendar-picker-indicator {
    filter: none;
  }

  .btn-gradient {
    background: linear-gradient(135deg, #9ad3b6 0%, #b6efd1 100%);
    color: #003825;
    transition: opacity 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
  }
  .btn-gradient:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 0 24px rgba(154,211,182,0.35); }

  /* Shared primary action for light mode only, so the existing dark
     appearance (and the login/signup page-level variants) stays untouched. */
  html:not(.dark) .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    text-decoration: none;
    background: linear-gradient(135deg, #9ad3b6 0%, #4cd7f6 100%);
    color: #003825;
    transition: transform 0.2s ease, box-shadow 0.3s ease, opacity 0.2s ease;
  }
  html:not(.dark) .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(154,211,182,0.25); }
  html:not(.dark) .btn-primary:active { transform: scale(0.98); }
  html:not(.dark) .btn-primary:focus-visible { outline: 2px solid #4cd7f6; outline-offset: 2px; }
  html:not(.dark) .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

  .social-btn {
    background: rgba(50, 53, 54, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .social-btn:hover { background: rgba(50, 53, 54, 0.85); transform: translateY(-1px); }

  .fix-spinner { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #404943; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #8a938c; }

  /* ============================================================
     LIGHT MODE — component + utility refinements.
     These only apply when the `dark` class is absent, so the
     original dark design is untouched.
     ============================================================ */
  html:not(.dark) .ambient-bg {
    background:
      radial-gradient(circle at 15% 10%, rgba(15, 107, 74, 0.10) 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(0, 103, 125, 0.07) 0%, transparent 50%),
      radial-gradient(circle at 60% 40%, rgba(122, 31, 191, 0.04) 0%, transparent 50%);
  }
  html:not(.dark) .glass-panel {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(15, 40, 28, 0.09);
    box-shadow: 0 8px 24px rgba(15, 40, 28, 0.05);
  }
  /* The supplied logo has a dark background baked into the PNG.
     Swap to the transparent/dark-wordmark variant on light pages. */
  html:not(.dark) img[alt="Synora AI Logo"],
  html:not(.dark) img[alt="Synora"] {
    content: url("/static/logo-light.png");
  }
  /* Dimmed "missed task" demo card: keep it de-emphasised without
     dropping below readable contrast in light mode. */
  html:not(.dark) input[name="option"] { accent-color: #0f6b4a; }
  html:not(.dark) .delayed-task { opacity: 0.88; }
  html:not(.dark) .delayed-task .text-on-surface-variant { color: #33403a; }
  html:not(.dark) .delayed-task .text-error { color: #a11414; }
  html:not(.dark) .glass-strong {
    background: rgba(255, 255, 255, 0.94);
    border-color: rgba(15, 40, 28, 0.1);
    box-shadow: 0 20px 60px rgba(15, 40, 28, 0.12);
  }
  html:not(.dark) .synora-gradient {
    background: linear-gradient(135deg, #0f6b4a 0%, #0e7490 100%);
  }
  /* Some controls swap text-on-primary in via JS while a lower-contrast
     text-on-surface-variant class is still present. Keep solid accent
     surfaces on white text in light mode. */
  html:not(.dark) .bg-primary.text-on-primary,
  html:not(.dark) .bg-secondary.text-on-primary,
  html:not(.dark) .bg-tertiary.text-on-primary,
  html:not(.dark) .bg-primary.text-white,
  html:not(.dark) .bg-secondary.text-white,
  html:not(.dark) .bg-tertiary.text-white {
    color: #ffffff !important;
  }
  html:not(.dark) .synora-gradient:disabled {
    background: rgba(15, 40, 28, 0.12);
    color: #4d5851;
    box-shadow: none;
    opacity: 1;
  }
  html:not(.dark) .text-error { color: #9f1d1d !important; }
  html:not(.dark) .text-primary\/70 { color: #0f6b4a !important; }
  html:not(.dark) .text-on-surface-variant\/70,
  html:not(.dark) .text-on-surface-variant\/80 { color: #4d5851 !important; }
  html:not(.dark) ::placeholder { color: #626c65 !important; opacity: 1; }
  /* Light-mode dialogs should dim the page softly, not turn it black. */
  html:not(.dark) .inset-0.bg-black\/60,
  html:not(.dark) .inset-0.bg-black\/70 {
    background-color: rgba(15, 40, 28, 0.3) !important;
  }
  html:not(.dark) .text-gradient {
    background: linear-gradient(135deg, #0f6b4a 0%, #0e7490 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  html:not(.dark) .btn-gradient {
    background: linear-gradient(135deg, #0f6b4a 0%, #15803d 100%);
    color: #ffffff;
  }
  html:not(.dark) .btn-primary {
    background: linear-gradient(135deg, #0f6b4a 0%, #0e7490 100%);
    color: #ffffff;
  }
  html:not(.dark) .btn-primary:hover {
    box-shadow: 0 8px 24px rgba(15, 107, 74, 0.28);
  }
  html:not(.dark) .btn-primary:focus-visible { outline-color: #0e7490; }
  html:not(.dark) .btn-primary:disabled {
    background: rgba(15, 40, 28, 0.12);
    color: #4d5851;
    opacity: 1;
  }
  html:not(.dark) .social-btn {
    background: rgba(255, 255, 255, 0.85);
    border-color: rgba(15, 40, 28, 0.1);
  }
  html:not(.dark) .social-btn:hover { background: #ffffff; }
  html:not(.dark) .glow-effect { box-shadow: 0 0 40px rgba(15, 107, 74, 0.12); }
  html:not(.dark) ::-webkit-scrollbar-thumb { background: #c3cec7; }
  html:not(.dark) ::-webkit-scrollbar-thumb:hover { background: #9aa8a0; }

  /* Accent text tones that would be too pale on a light surface */
  html:not(.dark) .text-primary-fixed,
  html:not(.dark) .hover\:text-primary-fixed:hover,
  html:not(.dark) .text-primary-fixed-dim {
    color: rgb(var(--c-primary)) !important;
  }
  html:not(.dark) .text-secondary-fixed,
  html:not(.dark) .text-secondary-fixed-dim {
    color: rgb(var(--c-on-secondary-fixed-variant)) !important;
  }
  html:not(.dark) .text-tertiary-fixed,
  html:not(.dark) .text-tertiary-fixed-dim {
    color: rgb(var(--c-tertiary)) !important;
  }

  /* Hairline / surface utilities written as white alpha in the dark theme */
  html:not(.dark) .border-white\/5 { border-color: rgba(15, 40, 28, 0.08) !important; }
  html:not(.dark) .border-white\/10 { border-color: rgba(15, 40, 28, 0.11) !important; }
  html:not(.dark) .border-white\/20 { border-color: rgba(15, 40, 28, 0.16) !important; }
  html:not(.dark) .border-white\/25 { border-color: rgba(15, 40, 28, 0.2) !important; }
  html:not(.dark) .hover\:border-white\/10:hover { border-color: rgba(15, 40, 28, 0.16) !important; }
  html:not(.dark) .hover\:border-white\/20:hover { border-color: rgba(15, 40, 28, 0.22) !important; }
  html:not(.dark) .hover\:border-white\/25:hover { border-color: rgba(15, 40, 28, 0.28) !important; }
  html:not(.dark) .bg-white\/5 { background-color: rgba(15, 40, 28, 0.05) !important; }
  html:not(.dark) .bg-white\/10 { background-color: rgba(15, 40, 28, 0.08) !important; }
  html:not(.dark) .bg-white\/20 { background-color: rgba(15, 40, 28, 0.14) !important; }
  html:not(.dark) .hover\:bg-white\/5:hover { background-color: rgba(15, 40, 28, 0.06) !important; }
  html:not(.dark) .hover\:bg-white\/10:hover { background-color: rgba(15, 40, 28, 0.1) !important; }
  html:not(.dark) .hover\:bg-white\/20:hover { background-color: rgba(15, 40, 28, 0.16) !important; }
  html:not(.dark) .via-white\/20 {
    --tw-gradient-stops: var(--tw-gradient-from), rgba(15, 40, 28, 0.14), var(--tw-gradient-to);
  }
  html:not(.dark) .shadow-black\/20 { --tw-shadow-color: rgba(15, 40, 28, 0.12); }

  /* ---------- Auth / split-screen pages (login, signup) ---------- */
  html:not(.dark) .split-left {
    background: linear-gradient(135deg, #e9f5ee 0%, #f4f8f4 50%, #e8f5fa 100%);
  }
  html:not(.dark) .split-left::before {
    background: radial-gradient(circle at 30% 40%, rgba(15, 107, 74, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(0, 103, 125, 0.08) 0%, transparent 50%);
  }
  html:not(.dark) .split-right { background: rgb(var(--c-background)); }
  html:not(.dark) .brand-content .logo { filter: drop-shadow(0 6px 18px rgba(15, 107, 74, 0.18)); }
  html:not(.dark) .brand-content h2 {
    background: linear-gradient(135deg, #0f6b4a, #0e7490);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  html:not(.dark) .brand-content p { color: #4b5751; }
  html:not(.dark) .quote-card {
    background: rgba(255, 255, 255, 0.75);

  /* ---------- Theme toggle (sidebar + floating fallback) ---------- */

<script>
  /* ============================================================
     Global theme controller — used by the sidebar, Settings and
     the floating fallback toggle so every screen stays in sync.
     ============================================================ */
  (function () {
    var KEY = "synora-theme";

    function isDark() {
      return document.documentElement.classList.contains("dark");
    }

    function syncControls() {
      var dark = isDark();

      document.querySelectorAll("[data-theme-toggle-btn]").forEach(function (btn) {
        var knob = btn.querySelector("span");
        if (knob) {
          knob.style.transform = dark ? "translateX(20px)" : "translateX(0)";
          knob.classList.toggle("bg-primary", dark);
          knob.classList.toggle("bg-on-surface-variant", !dark);
        }
        btn.style.backgroundColor = dark ? "#295f48" : "#d7ded8";
        btn.setAttribute("aria-checked", String(dark));
        btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
        btn.title = dark ? "Switch to light mode" : "Switch to dark mode";
      });

      document.querySelectorAll("[data-theme-toggle-checkbox]").forEach(function (cb) {
        cb.checked = dark;
      });

      document.querySelectorAll("[data-theme-label]").forEach(function (el) {
        el.textContent = dark ? "Dark Mode" : "Light Mode";
      });

      document.querySelectorAll("[data-theme-icon]").forEach(function (el) {
        el.textContent = dark ? "dark_mode" : "light_mode";
      });

      var fab = document.getElementById("synoraThemeFab");
      if (fab) {
        var icon = fab.querySelector(".material-symbols-outlined");
        if (icon) icon.textContent = dark ? "light_mode" : "dark_mode";
        fab.title = dark ? "Switch to light mode" : "Switch to dark mode";
        fab.setAttribute("aria-label", fab.title);
      }

      document.dispatchEvent(new CustomEvent("synora:themechange", { detail: { theme: dark ? "dark" : "light" } }));
    }

    function apply(theme, persist) {
      var dark = theme !== "light";
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      if (persist) {
        try { localStorage.setItem(KEY, dark ? "dark" : "light"); } catch (e) {}
      }
      syncControls();
    }

    window.SynoraTheme = {
      get: function () { return isDark() ? "dark" : "light"; },
      isDark: isDark,
      apply: apply,
      toggle: function () { apply(isDark() ? "light" : "dark", true); }
    };

    function injectFallbackToggle() {
      if (document.getElementById("synoraThemeFab")) return;
      if (document.querySelector("[data-theme-toggle-btn]")) {
        document.body.classList.add("has-theme-toggle-btn");
      }
      var btn = document.createElement("button");
      btn.id = "synoraThemeFab";
      btn.type = "button";
      btn.className = "theme-fab";
      btn.innerHTML = '<span class="material-symbols-outlined">' + (isDark() ? "light_mode" : "dark_mode") + "</span>";
      btn.addEventListener("click", function () { window.SynoraTheme.toggle(); });
      document.body.appendChild(btn);
    }

    document.addEventListener("DOMContentLoaded", function () {
      /* Pick up a theme chosen on another tab. */
      window.addEventListener("storage", function (e) {
        if (e.key === KEY && e.newValue) apply(e.newValue, false);
      });
      document.addEventListener("click", function (e) {
        var btn = e.target.closest && e.target.closest("[data-theme-toggle-btn]");
        if (btn) window.SynoraTheme.toggle();
      });
      document.addEventListener("change", function (e) {
        var cb = e.target.closest && e.target.closest("[data-theme-toggle-checkbox]");
        if (cb) apply(cb.checked ? "dark" : "light", true);
      });
      injectFallbackToggle();
      syncControls();
    });
  })();
</script>
