<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Synora AI{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "background": "#111415",
          "surface": "#111415",
          "surface-dim": "#111415",
          "surface-bright": "#373a3b",
          "surface-container-lowest": "#0c0f10",
          "surface-container-low": "#191c1d",
          "surface-container": "#1d2021",
          "surface-container-high": "#282a2b",
          "surface-container-highest": "#323536",
          "surface-variant": "#323536",
          "on-surface": "#e1e3e4",
          "on-surface-variant": "#c0c9c2",
          "on-background": "#e1e3e4",
          "inverse-surface": "#e1e3e4",
          "inverse-on-surface": "#2e3132",
          "outline": "#8a938c",
          "outline-variant": "#404943",
          "surface-tint": "#9ad3b6",
          "primary": "#9ad3b6",
          "on-primary": "#003825",
          "primary-container": "#295f48",
          "on-primary-container": "#9ed7ba",
          "inverse-primary": "#336851",
          "primary-fixed": "#b6efd1",
          "primary-fixed-dim": "#9ad3b6",
          "on-primary-fixed": "#002114",
          "on-primary-fixed-variant": "#18503a",
          "secondary": "#ddb7ff",
          "on-secondary": "#490080",
          "secondary-container": "#6f00be",
          "on-secondary-container": "#d6a9ff",
          "secondary-fixed": "#f0dbff",
          "secondary-fixed-dim": "#ddb7ff",
          "on-secondary-fixed": "#2c0051",
          "on-secondary-fixed-variant": "#6900b3",
          "tertiary": "#4cd7f6",
          "on-tertiary": "#003640",
          "tertiary-container": "#005e6e",
          "on-tertiary-container": "#51dbfa",
          "tertiary-fixed": "#acedff",
          "tertiary-fixed-dim": "#4cd7f6",
          "on-tertiary-fixed": "#001f26",
          "on-tertiary-fixed-variant": "#004e5c",
          "error": "#ffb4ab",
          "on-error": "#690005",
          "error-container": "#93000a",
          "on-error-container": "#ffdad6"
        },
        fontFamily: {
          sans: ["Plus Jakarta Sans", "ui-sans-serif", "system-ui", "sans-serif"]
        },
        borderRadius: {
          "xl": "1rem",
          "2xl": "1.25rem",
          "3xl": "1.5rem"
        },
        boxShadow: {
          "glow-primary": "0 0 30px rgba(154,211,182,0.25)",
          "glow-tertiary": "0 0 30px rgba(76,215,246,0.25)",
          "glass": "0 8px 32px rgba(0,0,0,0.35)"
        }
      }
    }
  };
</script>
<style>
  html { scroll-behavior: smooth; }
  body {
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    background-color: #111415;
    color: #e1e3e4;
    transition: background-color 0.3s ease;
  }
  html:not(.dark) body { background-color: #e8ece9; }

  .glass-panel {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .glass-strong {
    background: rgba(17, 20, 21, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .synora-gradient {
    background: linear-gradient(135deg, #9ad3b6 0%, #4cd7f6 100%);
  }
  .text-gradient {
    background: linear-gradient(135deg, #9ad3b6 0%, #4cd7f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .glow-effect { box-shadow: 0 0 40px rgba(41, 95, 72, 0.35); }
  .healing-glow { box-shadow: 0 0 18px rgba(76, 215, 246, 0.25); }

  .ambient-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 15% 10%, rgba(41, 95, 72, 0.18) 0%, transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(76, 215, 246, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 60% 40%, rgba(111, 0, 190, 0.06) 0%, transparent 50%);
  }

  .input-glass {
    background: rgba(25, 28, 29, 0.8);
    border: 1px solid rgba(138, 147, 140, 0.3);
    transition: all 0.3s ease;
  }
  .input-glass:focus-within {
    border-color: #9ad3b6;
    box-shadow: 0 0 0 1px #9ad3b6, 0 0 18px rgba(154, 211, 182, 0.15);
  }
  html:not(.dark) .input-glass { background: rgba(255,255,255,0.85); }

  .btn-gradient {
    background: linear-gradient(135deg, #9ad3b6 0%, #b6efd1 100%);
    color: #003825;
    transition: opacity 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
  }
  .btn-gradient:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 0 24px rgba(154,211,182,0.35); }

  .social-btn {
    background: rgba(50, 53, 54, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .social-btn:hover { background: rgba(50, 53, 54, 0.85); transform: translateY(-1px); }

  .fix-spinner { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #404943; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #8a938c; }
</style>
