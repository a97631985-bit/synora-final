<!DOCTYPE html>
<html class="dark" lang="en">
<head>{% include "head.html" %}</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden antialiased">
<div class="ambient-bg"></div>
<style>
  @keyframes slideUp2 { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .card { width:100%; max-width:400px; animation:slideUp2 0.5s ease-out; }
  .input-wrap2 {
    display:flex; align-items:center; background:rgba(12,15,16,0.8);
    border:1.5px solid rgba(138,147,140,0.2); border-radius:14px; transition:all 0.3s;
  }
  .input-wrap2:focus-within { border-color:#9ad3b6; box-shadow:0 0 0 3px rgba(154,211,182,0.1); }
  .input-wrap2 .icon { padding:0 14px; color:#404943; display:flex; align-items:center; }
  .input-wrap2 input { flex:1; background:transparent; border:none; outline:none; padding:14px 14px 14px 0; color:#e1e3e4; font-size:0.9rem; font-family:inherit; }
</style>
<main class="w-full max-w-md px-4 relative z-10">
  <div class="flex justify-center mb-6"><img src="/static/logo.png" alt="Synora" class="h-10 w-auto"></div>
  <div class="card glass-panel rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    <div class="text-center mb-6">
      <div class="w-16 h-16 rounded-2xl synora-gradient flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-on-primary" style="font-size:32px; font-variation-settings:'FILL' 1;">lock_reset</span>
      </div>
      <h1 class="text-xl font-bold">Forgot Password</h1>
      <p class="text-on-surface-variant text-sm mt-1">Enter your email and we'll send you a reset link.</p>
    </div>
    {% if error %}<div class="bg-error-container/20 border border-error/30 text-on-error-container rounded-xl px-4 py-3 text-sm mb-4">{{ error }}</div>{% endif %}
    <form action="/forgot-password" method="POST">
      <label style="display:block; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#8a938c; margin-bottom:6px">Email Address</label>
      <div class="input-wrap2">
        <span class="icon"><span class="material-symbols-outlined">mail</span></span>
        <input name="email" type="email" required placeholder="you@email.com">
      </div>
      <button type="submit" class="btn-primary mt-5" style="display:flex; align-items:center; justify-content:center; gap:8px">
        <span class="material-symbols-outlined" style="font-size:18px">send</span> Send Reset Link
      </button>
    </form>
    <p class="text-center mt-5 text-sm text-on-surface-variant">Remembered it? <a href="/login" class="text-primary font-bold hover:underline">Back to login</a></p>
  </div>
</main>
</body></html>
