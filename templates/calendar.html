<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  {% include "head.html" %}
</head>
<body class="bg-background text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<div class="ambient-bg"></div>
{% include "sidebar.html" %}

<div class="md:ml-64 min-h-screen flex flex-col relative">
  <header class="flex justify-between items-center px-6 py-4 bg-surface/40 backdrop-blur-md sticky top-0 z-40 border-b border-white/5">
    <span class="text-xl font-semibold text-on-surface">Calendar</span>
    <button id="addEventBtn" class="bg-primary-container text-on-primary-container text-sm font-semibold px-5 py-2 rounded-full hover:bg-inverse-primary hover:text-primary-fixed transition-all active:scale-95 flex items-center gap-2 glow-effect">
      <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">event</span>
      Add Event
    </button>
  </header>

  <main class="flex-1 p-5 md:p-10 max-w-7xl mx-auto w-full pb-16">
    <!-- Month Navigation -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <button id="prevMonth" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary hover:border-primary/40 transition-all">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <h2 id="monthLabel" class="text-2xl font-bold tracking-[-0.02em]"></h2>
        <button id="nextMonth" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface-variant hover:text-primary hover:border-primary/40 transition-all">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
      <button id="todayBtn" class="px-4 py-2 rounded-full glass-panel text-sm font-semibold text-on-surface-variant hover:text-primary hover:border-primary/40 transition-all">Today</button>
    </div>

    <!-- Calendar Grid -->
    <div class="glass-strong rounded-3xl overflow-hidden">
      <div class="grid grid-cols-7 border-b border-white/10 bg-surface-container-low/40">
        {% for d in ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] %}
        <div class="py-3 text-center text-xs font-semibold uppercase tracking-wider text-on-surface-variant">{{ d }}</div>
        {% endfor %}
      </div>
      <div id="calendarGrid" class="grid grid-cols-7">
        <div class="col-span-7 p-10 text-center text-on-surface-variant">
          <span class="material-symbols-outlined animate-spin inline-block">progress_activity</span>
          <p class="mt-2 text-sm">Loading calendar...</p>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-4 mt-5 text-xs font-semibold text-on-surface-variant">
      <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-primary"></span> Tasks Today</span>
      <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-tertiary"></span> AI-Healed</span>
      <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-error/60"></span> Completed</span>
      <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-primary-container"></span> Selected</span>
    </div>
  </main>
</div>

<!-- Add Event Modal -->
<div id="eventModal" class="fixed inset-0 z-50 hidden items-center justify-center p-5">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeEventModal()"></div>
  <div class="relative glass-strong rounded-3xl p-8 w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-lg font-bold">Add Event</h3>
      <button onclick="closeEventModal()" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="eventForm" class="flex flex-col gap-4">
      <div>
        <label class="text-sm font-semibold text-on-surface-variant mb-1 block">Event Name</label>
        <input id="eName" class="w-full input-glass text-on-surface rounded-xl px-4 py-3 placeholder-outline-variant" placeholder="E.g., Group Study — DBMS" required>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-semibold text-on-surface-variant mb-1 block">Start</label>
          <input id="eStart" type="time" class="w-full input-glass text-on-surface rounded-xl px-4 py-3" value="14:00">
        </div>
        <div>
          <label class="text-sm font-semibold text-on-surface-variant mb-1 block">End</label>
          <input id="eEnd" type="time" class="w-full input-glass text-on-surface rounded-xl px-4 py-3" value="15:30">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-semibold text-on-surface-variant mb-1 block">Energy</label>
          <select id="eEnergy" class="w-full input-glass text-on-surface rounded-xl px-4 py-3 cursor-pointer">
            <option class="bg-surface text-on-surface" value="High">High</option>
            <option class="bg-surface text-on-surface" value="Med" selected>Med</option>
            <option class="bg-surface text-on-surface" value="Low">Low</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-semibold text-on-surface-variant mb-1 block">Priority</label>
          <select id="ePriority" class="w-full input-glass text-on-surface rounded-xl px-4 py-3 cursor-pointer">
            <option class="bg-surface text-on-surface" value="P1">P1</option>
            <option class="bg-surface text-on-surface" value="P2" selected>P2</option>
            <option class="bg-surface text-on-surface" value="P3">P3</option>
          </select>
        </div>
      </div>
      <button type="submit" class="synora-gradient text-on-primary font-semibold rounded-xl py-3 mt-2 hover:opacity-90 hover:scale-[1.01] active:scale-95 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">add_circle</span>
        Add Event
      </button>
    </form>
  </div>
</div>

<script>
var viewDate = new Date();
viewDate.setDate(1);
var allTasks = [];

var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function closeEventModal() {
  var m = document.getElementById("eventModal");
  m.classList.add("hidden"); m.classList.remove("flex");
}

function taskChip(t) {
  var cls = t.completed
    ? "bg-error/25 text-on-error-container border-error/40"
    : t.healed
      ? "bg-tertiary-container/25 text-tertiary border-tertiary/40"
      : "bg-primary-container/40 text-on-primary-container border-primary/40";
  var icon = t.completed ? "check_circle" : t.healed ? "auto_fix_normal" : "task_alt";
  return '<div class="' + cls + ' border rounded-lg px-1.5 py-0.5 text-[10px] font-semibold truncate flex items-center gap-1" title="' + t.name + ' (' + t.start_time + ' - ' + t.end_time + ')">'
    + '<span class="material-symbols-outlined text-[11px] shrink-0">' + icon + '</span>'
    + '<span class="truncate">' + t.name + '</span></div>';
}

function renderCalendar() {
  var grid = document.getElementById("calendarGrid");
  var label = document.getElementById("monthLabel");
  label.textContent = MONTHS[viewDate.getMonth()] + " " + viewDate.getFullYear();

  var today = new Date();
  var first = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  var startOffset = (first.getDay() + 6) % 7; /* Monday first */
  var daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

  var cells = "";
  for (var i = 0; i < startOffset; i++) {
    var prev = new Date(viewDate.getFullYear(), viewDate.getMonth(), -startOffset + i + 1);
    cells += '<div class="min-h-[96px] border border-white/5 bg-surface-container-lowest/40 p-2 opacity-40">'
      + '<span class="text-xs text-on-surface-variant font-semibold">' + prev.getDate() + '</span></div>';
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var isToday = d === today.getDate() && viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear();
    var isCurrent = viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear();
    var chips = isCurrent && isToday && allTasks.length
      ? '<div class="mt-1.5 space-y-1">' + allTasks.map(taskChip).join("") + '</div>'
      : "";
    cells += '<div class="min-h-[96px] border border-white/5 p-2 hover:bg-surface-container-low/60 transition-colors '
      + (isToday ? "bg-primary-container/30 shadow-[inset_0_0_0_1px_rgba(154,211,182,0.5)]" : "bg-surface-container-low/20")
      + '">'
      + '<span class="text-xs font-semibold ' + (isToday ? "text-primary" : "text-on-surface-variant") + '">' + d + '</span>'
      + chips
      + '</div>';
  }

  grid.innerHTML = cells;
}

async function loadTasks() {
  try {
    var res = await fetch("/api/tasks");
    var data = await res.json();
    allTasks = data.tasks;
  } catch (e) { allTasks = []; }
  renderCalendar();
}

document.addEventListener("DOMContentLoaded", function () {
  loadTasks();
  document.getElementById("prevMonth").addEventListener("click", function () {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderCalendar();
  });
  document.getElementById("todayBtn").addEventListener("click", function () {
    viewDate = new Date(); viewDate.setDate(1);
    renderCalendar();
  });
  document.getElementById("addEventBtn").addEventListener("click", function () {
    var m = document.getElementById("eventModal");
    m.classList.remove("hidden"); m.classList.add("flex");
  });
  document.getElementById("eventForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var name = document.getElementById("eName").value.trim();
    if (!name) return;
    await fetch("/api/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name,
        start_time: document.getElementById("eStart").value,
        end_time: document.getElementById("eEnd").value,
        energy: document.getElementById("eEnergy").value,
        priority: document.getElementById("ePriority").value
      })
    });
    closeEventModal();
    document.getElementById("eName").value = "";
    loadTasks();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeEventModal(); });
});
</script>
</body>
</html>
