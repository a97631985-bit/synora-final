databases:
  - name: synora-db
    databaseName: synora
    user: synora
    plan: free

services:
  - type: web
    name: synora-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: synora-db
          property: connectionString
      # REQUIRED in production: generate a long random secret, e.g.
      #   python -c "import secrets; print(secrets.token_hex(32))"
      - key: SYNORA_SECRET
        sync: false
      # Optional: Gmail app-password for real email OTP
      - key: MAIL_EMAIL
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ADMIN_KEY
        value: synora-admin-2026
      # Account that acts as community admin/dev (gets verified badge + can moderate
      # reported posts and update feedback status).
      - key: ADMIN_EMAIL
        value: admin@synora.app
      - key: PYTHON_VERSION
        value: "3.11"
      # Optional: tune auth rate limiting (requests per 60s window per IP)
      - key: RATE_IP
        value: "30"
      - key: RATE_LOGIN
        value: "8"
      - key: RATE_OTP
        value: "5"
      - key: RATE_SIGNUP
        value: "6"
      - key: RATE_RESET
        value: "5"
