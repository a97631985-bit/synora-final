databases:
  - name: synora-db
    databaseName: synora
    user: synora
    plan: free

services:
  - type: web
    name: synora-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: synora-db
          property: connectionString
      - key: ADMIN_KEY
        value: synora-admin-2026
      - key: PYTHON_VERSION
        value: "3.11"
